[package]
name = "filmspec"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to generate film spectrum from video files"
license = "MIT"

[features]
default = ["gui"]
gui = ["gpui", "gpui-component", "gpui-component-assets", "smallvec", "regex"]
cli-only = []

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"

# GUI dependencies (optional)
gpui = { version = "0.2.2", optional = true }
gpui-component = { version = "0.5", optional = true }
gpui-component-assets = { version = "0.5", optional = true }
smallvec = { version = "1.13", optional = true }
regex = { version = "1", optional = true }

