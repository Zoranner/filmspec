[package]
name = "filmspec"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to generate film spectrum from video files"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = "0.25"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"

